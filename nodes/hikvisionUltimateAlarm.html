<script type="text/javascript">
	RED.nodes.registerType('hikvisionUltimateAlarm', {
		category: 'Hikvision Ultimate',
		color: '#C0C0C0',
		defaults: {
			name: { value: "" },
			topic: { value: "" },
			server: { type: "Hikvision-config", required: true },
			reactto: { value: "vmd" },
			devicetype: { value: 0 },
			filterzone: { value: "0" },
			alarmfilterduration: { value: 0 },
			alarmfilterperiod: { value: 0 },
			channelID: { value: "0" }
		},
		inputs: 0,
		outputs: 3,
		outputLabels: function (i) {
			var ret = "";
			switch (i) {
				case 0:
					return "Payload";
					break;
				case 1:
					return "Error";
					break;
				case 2:
					return "Image";
					break;
				default:
					break;
			}
		},
		icon: "node-alarm.svg",
		label:
			function () {
				var label = "Camera Event"
				if (this.name !== undefined && this.name.length > 0) {
					label = this.name;
				}
				return label;// + " " + this.reactto;
			},
		paletteLabel: function () {
			return "Camera Event";
		},
		oneditprepare: function () {
			var node = this;
			if (node._alarmDiscoveryCleanup) node._alarmDiscoveryCleanup();
			var $event = $("#node-input-reactto");
			var $channel = $("#node-input-channelID");
			var $zone = $("#node-input-filterzone");
			var $metadataStatus = $("#node-alarm-metadata-status");
			var $server = $("#node-input-server");
			var $device = $("#node-input-devicetype");
			var $refresh = $("#node-alarm-discovery-refresh");
			var $status = $("#node-alarm-discovery-status");
			var $custom = $("#node-alarm-custom-event");
			var $customBox = $("#node-alarm-custom-event-box");
			var $useCustom = $("#node-alarm-use-custom-event");
			var customEventOption = "#custom-event-id";
			var customMode = false;
			var $duration = $("#node-input-alarmfilterduration");
			var catalog = [];
			$event.find("option").each(function () {
				catalog.push({ id: this.value, label: $(this).text() });
			});
			// Most ISAPI aliases are already comma-separated in the catalog.
			// Keep single-ID defaults and existing flow values compatible too.
			// Behavioral tests check this catalog against alarmEventAliases.js.
			var supplementalEventAliases = {
				vmd: ["motionDetection"],
				shelteralarm: ["tamperDetection"],
				// Older catalogs accidentally included an invisible U+200B here.
				AID_congestion: ["AID_\u200bcongestion"],
				AID_construction: ["AID_\u200bconstruction"],
				AID_trafficAccident: ["AID_\u200btrafficAccident"],
				AID_fogDetection: ["AID_\u200bfogDetection"],
				TFS_wrongDirection: ["TFS_\u200bwrongDirection"]
			};
			// Offer recognition events in the dedicated Intelligent Event node.
			// This only filters editor suggestions: saved flows and custom IDs
			// retain their runtime behavior. Match explicit event IDs, never labels
			// or target metadata (e.g. a line alarm detecting a person stays here).
			var recognitionEvents = Object.create(null);
			[
				"facedetection", "faceCapture", "faceSnap", "faceRecognition", "faceDetect",
				"peopleDetection", "humanDetection", "personDetection", "personRecognition",
				"targetCapture", "humanRecognition", "ANPR", "vehicleDetection",
				"vehicleRecognition", "vehicleCapture", "vehicleRcogResult", "vehicleControl",
				"alarmResult", "faceContrast", "mixedTargetDetection", "MTD_face", "MTD_human",
				"MTD_vehicle", "MTD_nonMotor", "faceSnapModeling", "HVTVehicleDetection",
				"PictureCaptureComparision", "animalDetection", "animalRecognition",
				"animalCapture", "zoologyDetection"
			].forEach(function (id) { recognitionEvents[id.toLowerCase()] = true; });
			function isRecognitionEvent(value) {
				return typeof value === "string" && value.split(",").some(function (id) { return recognitionEvents[id.trim().toLowerCase()] === true; });
			}
			var currentDevice = String(node.devicetype == null ? 0 : node.devicetype);
			var selectedByDevice = Object.create(null);
			selectedByDevice[currentDevice] = node.reactto || "vmd";
			var selectedChannel = String(node.channelID == null ? "0" : node.channelID);
			var selectedZone = String(node.filterzone == null ? "0" : node.filterzone);
			var metadata = { channels: [], zones: [] };
			var metadataRequest = null;
			var metadataGeneration = 0;
			var metadataPending = false;
			var metadataForce = false;
			var metadataAmbiguousChannels = false;
			var metadataAmbiguousScenes = false;
			var capabilitiesLoading = false;
			var discovery = { events: [], channels: [] };
			var request = null;
			var generation = 0;
			var closed = false;

			function appendOption(parent, id, label, title) {
				var option = $("<option></option>").val(id).text(label);
				if (title) option.attr("title", title);
				parent.append(option);
			}
			function group(parent, label) {
				var result = $("<optgroup></optgroup>").attr("label", label);
				parent.append(result);
				return result;
			}
			function renderEvents() {
				var wanted = selectedByDevice[currentDevice];
				var marker = ["(Camera/NVR)", "(Security system)", "(Radar)"][Number(currentDevice)];
				var wantedAliases = typeof wanted === "string" ? wanted.split(",").map(function (id) { return id.trim().toLowerCase(); }) : [];
				var entries = catalog.filter(function (entry) { return entry.label.indexOf(marker) !== -1; }).map(function (entry) {
					var names = entry.id.split(",").concat(supplementalEventAliases[entry.id] || []).map(function (id) { return id.trim().toLowerCase(); });
					// A saved alias (or list within one group) uses the friendly option
					// without changing its exact stored value or adding a duplicate.
					var preserveSaved = wantedAliases.length && wantedAliases.every(function (id) { return id && names.indexOf(id) !== -1; });
					return { id: preserveSaved ? wanted : entry.id, label: entry.label, aliases: names };
				});
				var aliases = Object.create(null);
				var available = Object.create(null);
				var discoveredIDs = Object.create(null);
				var supported = [];
				var observed = [];
				entries.forEach(function (entry) {
					entry.aliases.forEach(function (alias) { aliases[alias] = entry; });
				});
				if (currentDevice === "0") discovery.events.forEach(function (event) {
					if (!event || typeof event.id !== "string" || !event.id || event.id.length > 512) return;
					if (isRecognitionEvent(event.id)) return;
					if (selectedChannel !== "0" && Array.isArray(event.channels) && event.channels.length &&
						!event.channels.some(function (id) { return String(id) === selectedChannel; })) return;
					var eventKey = event.id.toLowerCase();
					var known = aliases[eventKey];
					var savedUnknown = !known && wantedAliases.length && wantedAliases.every(function (id) { return id === eventKey; });
					var id = known ? known.id : (discoveredIDs[eventKey] || (savedUnknown ? wanted : event.id));
					discoveredIDs[eventKey] = id;
					var entry = available[id];
					if (!entry) {
						entry = available[id] = {
							id: id,
							label: known ? known.label : (event.label && event.label !== id ? event.label + " [" + id + "]" : id),
							capability: false, observed: false, hasState: false
						};
					}
					var sources = Array.isArray(event.sources) ? event.sources : [];
					entry.capability = entry.capability || sources.indexOf("capability") !== -1;
					entry.observed = entry.observed || sources.indexOf("observed") !== -1;
					entry.hasState = entry.hasState || event.hasState === true;
				});
				Object.keys(available).forEach(function (id) {
					var entry = available[id];
					if (entry.capability) supported.push(entry);
					else if (entry.observed) observed.push(entry);
					else delete available[id];
				});
				$event.empty();
				function addDiscovered(items, label) {
					if (!items.length) return;
					var parent = group($event, label);
					items.sort(function (a, b) { return a.label.localeCompare(b.label); }).forEach(function (entry) {
						var title = entry.id;
						if (entry.capability && entry.observed) title += " — also observed in the event stream";
						if (entry.observed && !entry.hasState) title += " — no active/inactive alarm state observed";
						appendOption(parent, entry.id, entry.label, title);
					});
				}
				addDiscovered(supported, "Supported by the device");
				addDiscovered(observed, "Observed in the event stream");
				if (currentDevice !== "0" && entries.length) {
					var parent = group($event, "Device event catalog");
					entries.forEach(function (entry) { appendOption(parent, entry.id, entry.label, entry.id); available[entry.id] = entry; });
				}
				if (!wanted && entries.length) wanted = entries[0].id;
				// Keep only the saved/custom selection when it was not discovered.
				// The catalog supplies its label and aliases without adding extra choices.
				if (wanted && !available[wanted]) {
					var current = entries.find(function (entry) { return entry.id === wanted; });
					appendOption(group($event, "Current / custom event"), wanted, current ? current.label : wanted,
						isRecognitionEvent(wanted) ? "Current selection — use Intelligent Event for recognition events" : "Current selection");
				}
				appendOption($event, customEventOption, "CUSTOM EVENT ID");
				$event.val(customMode ? customEventOption : wanted);
				$customBox.toggle(customMode);
				selectedByDevice[currentDevice] = wanted;
			}
			function renderChannels() {
				$channel.empty();
				appendOption($channel, "0", "All channels");
				var channels = Object.create(null);
				if (currentDevice === "0") discovery.channels.forEach(function (channel) {
					if (!channel || !/^[1-9][0-9]*$/.test(String(channel.id))) return;
					channels[String(channel.id)] = channel;
				});
				if (currentDevice === "0") metadata.channels.forEach(function (channel) {
					if (!channel || !/^[1-9][0-9]*$/.test(String(channel.id))) return;
					var id = String(channel.id);
					var previous = channels[id];
					channels[id] = { id: id, name: channel.name || (previous && previous.name) };
				});
				var ids = Object.keys(channels).sort(function (a, b) { return Number(a) - Number(b); });
				if (ids.length) {
					var discovered = group($channel, "Discovered channels");
					ids.forEach(function (id) {
						var channel = channels[id];
						appendOption(discovered, id, "Channel " + id + (channel.name ? " — " + channel.name : ""));
					});
				}
				if (selectedChannel !== "0" && !channels[selectedChannel]) {
					appendOption(group($channel, "Current selection"), selectedChannel, "Channel " + selectedChannel + " (current selection)");
				}
				$channel.val(selectedChannel);
			}
			function eventAliases(value) {
				var names = String(value || "").split(",").map(function (id) { return id.trim().toLowerCase(); }).filter(Boolean);
				catalog.forEach(function (entry) {
					var aliases = entry.id.split(",").concat(supplementalEventAliases[entry.id] || []).map(function (id) { return id.trim().toLowerCase(); });
					if (aliases.some(function (id) { return names.indexOf(id) !== -1; })) {
						aliases.forEach(function (id) { if (names.indexOf(id) === -1) names.push(id); });
					}
				});
				return names;
			}
			function renderZones() {
				var zones = Object.create(null);
				var ambiguousZoneIDs = Object.create(null);
				var channelIDs = Object.create(null);
				var allowedEvents = eventAliases(selectedByDevice[currentDevice]);
				metadataAmbiguousChannels = false;
				metadataAmbiguousScenes = false;
				if (currentDevice === "0" && !customMode) {
					metadata.channels.concat(discovery.channels).forEach(function (channel) {
						if (channel && /^[1-9][0-9]*$/.test(String(channel.id))) channelIDs[String(Number(channel.id))] = true;
					});
					metadata.zones.forEach(function (zone) {
						if (zone && /^[1-9][0-9]*$/.test(String(zone.channelID))) channelIDs[String(Number(zone.channelID))] = true;
					});
					metadataAmbiguousChannels = selectedChannel === "0" && Object.keys(channelIDs).length > 1;
					if (!metadataAmbiguousChannels) metadata.zones.forEach(function (zone) {
						if (!zone || !/^[1-9][0-9]*$/.test(String(zone.id)) || !/^[1-9][0-9]*$/.test(String(zone.channelID))) return;
						if (selectedChannel !== "0" && Number(zone.channelID) !== Number(selectedChannel)) return;
						if (!zone.eventType || !eventAliases(zone.eventType).some(function (id) { return allowedEvents.indexOf(id) !== -1; })) return;
						var id = String(zone.id);
						if (ambiguousZoneIDs[id]) return;
						var previous = zones[id];
						if (previous && String(previous.sceneID == null ? "" : previous.sceneID) !== String(zone.sceneID == null ? "" : zone.sceneID)) {
							delete zones[id];
							ambiguousZoneIDs[id] = true;
							metadataAmbiguousScenes = true;
							return;
						}
						zones[id] = zone;
					});
				}
				$zone.empty();
				appendOption($zone, "0", "All zones");
				var ids = Object.keys(zones).sort(function (a, b) { return Number(a) - Number(b); });
				if (ids.length) {
					var configured = group($zone, "Configured regions / rules");
					ids.forEach(function (id) {
						var zone = zones[id];
						var scene = zone.sceneID == null || zone.sceneID === "" ? "" : " (scene " + String(zone.sceneID) + ")";
						appendOption(configured, id, "Zone " + id + (zone.name ? " — " + zone.name : "") + scene);
					});
				}
				if (selectedZone !== "0" && !zones[selectedZone]) {
					appendOption(group($zone, "Current selection"), selectedZone, "Zone " + selectedZone + " (current selection)");
				}
				$zone.val(selectedZone);
			}
			function cancelMetadata() {
				metadataGeneration++;
				var pending = metadataRequest;
				metadataRequest = null;
				if (pending) pending.abort();
			}
			function showMetadataStatus(result) {
				var messages = {
					ok: "Channel and zone names updated.",
					cached: "Showing cached channel and zone names.",
					partial: "Some channel or zone names are unavailable. Current selections are preserved.",
					unavailable: "Names are unavailable. Current selections are preserved."
				};
				var message = messages[result.status] || messages.partial;
				if (metadataAmbiguousChannels) message += " Select a channel to see its region/rule names.";
				if (metadataAmbiguousScenes) message += " Conflicting zone names across scenes are omitted.";
				if (Array.isArray(result.warnings) && result.warnings.length) message += " " + result.warnings.map(function (warning) { return String(warning); }).join(" ");
				$metadataStatus.text(message);
			}
			function requestMetadata() {
				if (closed || capabilitiesLoading || !metadataPending || currentDevice !== "0" || customMode) return;
				var serverID = String($server.val() || "");
				if (!serverID || serverID === "_ADD_") return;
				var serial = metadataGeneration;
				var channelID = selectedChannel;
				var eventType = selectedByDevice[currentDevice];
				if (!eventType || eventType === customEventOption) return;
				var data = { nodeID: serverID, channelID: channelID, eventType: eventType };
				if (metadataForce) data.refresh = "true";
				metadataPending = false;
				metadataForce = false;
				$metadataStatus.text("Reading channel and zone names…");
				function isCurrent() {
					return !closed && serial === metadataGeneration && currentDevice === "0" && !customMode &&
						String($server.val() || "") === serverID && selectedChannel === channelID && selectedByDevice[currentDevice] === eventType;
				}
				metadataRequest = $.ajax({
					url: "hikvisionUltimateAlarmMetadata", type: "GET", dataType: "json", data: data, timeout: 45000
				}).done(function (result) {
					if (!isCurrent()) return;
					if (!result || !Array.isArray(result.channels) || !Array.isArray(result.zones)) {
						showMetadataStatus({ status: "unavailable" });
						return;
					}
					metadata = result;
					renderChannels();
					renderZones();
					showMetadataStatus(result);
				}).fail(function (xhr, reason) {
					if (!isCurrent() || reason === "abort") return;
					showMetadataStatus({ status: "unavailable" });
				}).always(function () { if (isCurrent()) metadataRequest = null; });
			}
			function queueMetadata(force) {
				cancelMetadata();
				metadata = { channels: [], zones: [] };
				metadataPending = true;
				metadataForce = metadataForce || force;
				renderChannels();
				renderZones();
				$metadataStatus.toggle(currentDevice === "0");
				if (currentDevice !== "0" || customMode) {
					metadataPending = false;
					$metadataStatus.text("");
					return;
				}
				var serverID = String($server.val() || "");
				if (!serverID || serverID === "_ADD_") {
					metadataPending = false;
					$metadataStatus.text("Select and deploy a server to read channel and zone names.");
					return;
				}
				$metadataStatus.text("Reading channel and zone names…");
				requestMetadata();
			}
			function cancelRequest() {
				generation++;
				capabilitiesLoading = false;
				var pending = request;
				request = null;
				if (pending) pending.abort();
			}
			function showStatus(result) {
				var messages = {
					ok: "Device capabilities updated. Supported does not mean enabled.",
					partial: "Discovery is partial. The current selection is preserved.",
					cached: "Showing cached capabilities and observed events.",
					unavailable: "Device discovery is unavailable. The current selection is preserved."
				};
				var message = messages[result.status] || messages.partial;
				if (Array.isArray(result.warnings) && result.warnings.length) message += " " + result.warnings.map(function (warning) { return String(warning); }).join(" ");
				$status.text(message);
			}
			function loadDiscovery(force, keepChannels) {
				cancelRequest();
				capabilitiesLoading = true;
				metadataForce = !!force;
				queueMetadata(force);
				var serial = generation;
				var serverID = String($server.val() || "");
				var channelID = selectedChannel;
				if (!force) {
					discovery = { events: [], channels: keepChannels ? discovery.channels : [] };
					renderEvents();
					renderChannels();
				}
				$("#node-alarm-discovery").toggle(currentDevice === "0");
				if (currentDevice !== "0") { capabilitiesLoading = false; return; }
				$refresh.prop("disabled", !serverID || serverID === "_ADD_");
				if (!serverID || serverID === "_ADD_") {
					capabilitiesLoading = false;
					$status.text("Select and deploy a server to discover its available events and channels.");
					return;
				}
				$status.text("Reading device capabilities…");
				var data = { nodeID: serverID, channelID: channelID };
				if (force) data.refresh = "true";
				function isCurrent() {
					return !closed && serial === generation && currentDevice === "0" &&
						String($server.val() || "") === serverID && selectedChannel === channelID;
				}
				request = $.ajax({
					url: "hikvisionUltimateAlarmCapabilities", type: "GET", dataType: "json", data: data, timeout: 45000
				}).done(function (result) {
					if (!isCurrent()) return;
					if (!result || !Array.isArray(result.events) || !Array.isArray(result.channels)) {
						showStatus({ status: "unavailable" });
						return;
					}
					discovery = result;
					renderEvents();
					renderChannels();
					showStatus(result);
				}).fail(function (xhr, reason) {
					if (!isCurrent() || reason === "abort") return;
					$status.text(xhr.status === 404 ?
						"Deploy this server before discovering capabilities. The current selection is preserved." :
						"Cannot read device capabilities. The current selection is preserved.");
				}).always(function () {
					if (!isCurrent()) return;
					request = null;
					capabilitiesLoading = false;
					requestMetadata();
				});
			}
			function updateFilters() {
				var enabled = currentDevice !== "0";
				$("#ui_alarmfilterduration").toggle(enabled);
				$("#ui_alarmfilterperiod").toggle(enabled && Number($duration.val()) !== 0);
			}
			$event.on("change.alarmDiscovery", function () {
				customMode = $event.val() === customEventOption;
				if (!customMode) selectedByDevice[currentDevice] = $event.val();
				else if (!$custom.val() && !catalog.some(function (entry) { return entry.id === selectedByDevice[currentDevice]; })) {
					$custom.val(selectedByDevice[currentDevice] || "");
				}
				$customBox.toggle(customMode);
				$("#node-alarm-custom-status").text("");
				queueMetadata(false);
			});
			$zone.on("change.alarmDiscovery", function () { selectedZone = String($zone.val() || "0"); });
			$channel.on("change.alarmDiscovery", function () {
				selectedChannel = String($channel.val() || "0");
				loadDiscovery(false, true);
			});
			$server.on("change.alarmDiscovery", function () { loadDiscovery(false, false); });
			$device.on("change.alarmDiscovery", function () {
				customMode = false;
				currentDevice = String($device.val());
				loadDiscovery(false, false);
				updateFilters();
			});
			$refresh.on("click.alarmDiscovery", function (event) { event.preventDefault(); loadDiscovery(true, true); });
			$useCustom.on("click.alarmDiscovery", function (event) {
				event.preventDefault();
				if (!customMode) return;
				var value = String($custom.val() || "").trim();
				if (!value || value.length > 512 || !/^[A-Za-z0-9_:-]+(?:,[A-Za-z0-9_:-]+)*$/.test(value)) {
					$("#node-alarm-custom-status").text("Enter an event ID, or comma-separated IDs without spaces.");
					return;
				}
				selectedByDevice[currentDevice] = value;
				customMode = false;
				renderEvents();
				$custom.val("");
				$("#node-alarm-custom-status").text("Selected custom event: " + value);
				queueMetadata(false);
			});
			$duration.on("change.alarmDiscovery", updateFilters);
			node._alarmDiscoveryCleanup = function () {
				closed = true;
				// The menu action is editor-only. Until Use event is clicked, keep
				// the actual selection when Node-RED saves the form.
				if (customMode) $event.val(selectedByDevice[currentDevice]);
				cancelRequest();
				cancelMetadata();
				[$event, $channel, $zone, $server, $device, $refresh, $custom, $useCustom, $duration].forEach(function (element) { element.off(".alarmDiscovery"); });
				delete node._alarmDiscoveryCleanup;
			};
			updateFilters();
			loadDiscovery(false, false);
		},
		oneditsave: function () {
			if (this._alarmDiscoveryCleanup) this._alarmDiscoveryCleanup();
		},
		oneditcancel: function () {
			if (this._alarmDiscoveryCleanup) this._alarmDiscoveryCleanup();
		}
	});


</script>

<script type="text/x-red" data-template-name="hikvisionUltimateAlarm">
	<div class="form-row">
		<b>Alarm node</b>&nbsp&nbsp&nbsp&nbsp<span style="color:red"><i class="fa fa-question-circle"></i>&nbsp<a target="_blank" href="https://github.com/Supergiovane/node-red-contrib-hikvision-ultimate"><u>Help online</u></a></span>
        <br/>
		<br/>
		
		<label for="node-input-server">Server</label>
		<input type="text" id="node-input-server" />
	</div>
	<div class="form-row">
        <label for="node-input-name"><i class="icon-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
	<div class="form-row">
        <label for="node-input-topic"><i class="fa fa-tasks"></i> Node topic</label>
        <input type="text" id="node-input-topic" placeholder="Node's own topic">
	</div>
	<div class="form-row">
        <label for="node-input-devicetype"><i class="fa fa-tasks"></i> Device type</label>
		<select id="node-input-devicetype">
			<option value=0>Camera or NVR/DVR</option>
			<option value=1>Old Alarm system (For example, Axiom) For new AX Pro and AX Hybrid use the AX PRO Node.</option>
			<option value=2>Radar</option>
		</select>
	</div>		
	<div class="form-row">
        <label for="node-input-reactto"><i class="fa fa-tasks"></i> React to Event</label>
		<select id="node-input-reactto">
			<option value="CID:1131-3131">Intrusion alarm (MOST COMMON: this is the intruder alarm) (Security system)</option>

<script type="text/markdown" data-help-name="hikvisionUltimateAlarm">
<p>Events and alarms from the camera/nvr.</p>

## CAMERA EVENT NODE

<img src='https://raw.githubusercontent.com/Supergiovane/node-red-contrib-hikvision-ultimate/master/img/hikcamera.jpg' >

The Camera Event node connects to ***NVR, Camera, Radars, etc..*** and outputs true/false in case of an alarm. <br/>
The node can be configured as **Camera/NVR** (with standard and smart events) or as **Old Security System** and **Radar** (with specific CID events, designed for these type of security devices)<br/>
You can optionally filter the alarms by CHANNEL, EVENT and ZONE. <br/>
For NVR/DVR, the ***Channel*** property is the CAMERA number, while for Cameras, is the image sensor number (normally 1).<br/>
The ***Zone*** property is the alarm zone (RADARS), or the alert region number (CAMERAS AND NVR/DVR).<br/>
For RADAR device types, you can filter improper/false alams as well.<br/>
On the third pin, the node will output the event's picture (if any). You can save it directly to disk or user where you want.<br/>

<img src='https://raw.githubusercontent.com/Supergiovane/node-red-contrib-hikvision-ultimate/master/img/GenericAlarm.png' >

You can choose from many different alarms, including: <br/>
- Video Motion Alarm (When motion is detected)
- Local alarm input (it's the device's IO pigtail connector)
- Line crossing (when someone crosses a line)
- CID alarms
- Many more.....



**Flow Messages**

The node outputs a payload on **PIN 1** (***TRUE*** on alarm start, ***FALSE*** on alarm end). Some alarm types only support the alarm start event.</br>
The node outputs a payload on **PIN 2**, representing a connection error. ***TRUE*** if error, otherwise ***FALSE***</br>
The node outputs a payload on **PIN 3**, with the captured image (as byte array), that you can directly save to disk or attach on an email or so. This pin emits a message only if the camera sends the captured image. This usually happens with "smart" events (but many firmwares out there, allow you to do it even with the basic events). You can check that by attaching a debug node on the third pin, then set a rule in the smart event and set the camera to send pictures in case of events (usually, you'll find this option in the "Archive management" menu of your camera).
Some thermal cameras send **Temperature Measurement Alarm** events as `eventType: "TMA"` and **Temperature Measurement Precautionary Alarm** events as `eventType: "TMPA"`. Select the corresponding event type to handle alarms and prealarms separately. The node also adds `msg.tma` or `msg.tmpa` (if present) with the temperature details sent by the device.
This below is an example of msg output:</br>


**Output PIN 1**
```javascript
// Example of an event from NVR/Camera
msg = {
	"payload": true,
	"topic": "",
	"channelid": "13", // This is the camera number for NVR, or the channel ID for cameras
	"zone": 0, // Zone or Region, see above, the explained difference
	"description": "Motion alarm",
	"_msgid": "386a613.89f259e"
}
```

```javascript
// Example of an event from Radar
msg = {
{
	"zone": 1, // This is the zone number that fired the alarm
	"payload": true, // true if alarm, otherwise false if alarm ended.
	"alarm": {
		"ipAddress": "192.168.1.25",
		"ipv6Address": "",
		"portNo": 80,
		"protocol": "HTTP",
		"macAddress": "BananaRama",
		"channelID": 1,
		"dateTime": "2012-01-13T03:58:19+01:00",
		"activePostCount": 1,
		"eventType": "cidEvent",
		"eventState": "active",
		"eventDescription": "CID event",
		"CIDEvent": {
			"code": 3103,
			"standardCIDcode": 3130,
			"type": "zoneAlarm",
			"trigger": "2012-01-13T03:58:19+01:00",
			"upload": "2012-01-13T03:58:19+01:00",
			"CameraList": [],
			"NVRList": [
				{
					"id": 1,
					"ip": "192.168.1.32",
					"port": 8000,
					"channel": 1
				}
			],
			"zone": 1
		}
	}
	"_msgid": "b07e50f6.86a72"
}
```

**Output PIN 2 (connection error)**
```javascript
msg = {
	"topic": "",
	"errorDescription": "", // This will contain the error rescription, in case of errors.
	"payload": false, // Or TRUE if error
	"_msgid": "dd5b3622.884a78"
}
```

**Output PIN 3 (Image)**
```javascript
msg = {
	"topic": "",
	"payload": image (Bytes),
	"extension": "jpg" // Can be "jpg" or "png"
}
```
